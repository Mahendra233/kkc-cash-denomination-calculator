/* KKC compact single-screen layout + prevent accidental zoom */
html, body { width:100%; height:100%; height:100dvh; margin:0; overflow:hidden; overscroll-behavior:none; -webkit-text-size-adjust:100%; touch-action:pan-x pan-y; }
body { padding:0; }
.app { width:100%; max-width:760px; height:100dvh; min-height:0; margin:0 auto; display:flex; flex-direction:column; overflow:hidden; }
.topbar { flex:0 0 auto; padding:calc(5px + env(safe-area-inset-top)) 10px 5px; }
.brand { gap:7px; }
.logo { width:39px; height:39px; padding:2px; }
.brand-name { font-size:clamp(13px,3.5vw,17px); line-height:1.12; }
.subtitle { margin-top:3px; font-size:13px; line-height:1.1; }
.top-actions { margin-top:3px; font-size:12px; }
.top-actions button { padding:3px 7px; }
#rows.rows { flex:1 1 auto; min-height:0; padding:2px 10px; display:flex; flex-direction:column; justify-content:space-evenly; overflow:hidden; }
.denom-row { flex:1 1 0; min-height:0; padding:1px 0; grid-template-columns:minmax(48px,68px) minmax(0,1fr) minmax(65px,83px); gap:6px; }
.denom-label { font-size:clamp(13px,3.6vw,17px); line-height:1; }
.count-input { height:clamp(29px,5.1dvh,42px); border-radius:9px; font-size:16px; padding:2px 5px; }
.line-total { font-size:clamp(12px,3.2vw,16px); line-height:1; }
.summary { flex:0 0 auto; position:static; padding:4px 10px calc(4px + env(safe-area-inset-bottom)); box-shadow:0 -2px 8px #172a3a08; }
.total-label { font-size:13px; line-height:1.1; }
.total-amount { font-size:clamp(22px,6vw,29px); margin-left:4px; }
.words { font-size:12px; line-height:1.15; margin:2px 0 4px; }
.date-line { font-size:10px; margin-bottom:5px; }
.actions { gap:5px; }
.action { min-height:36px; border-radius:10px; font-size:14px; padding:5px 3px; }
.actions .action:last-child { grid-column:1/-1; min-height:34px; }
.note { display:none; }
.toast { bottom:calc(125px + env(safe-area-inset-bottom)); }
button, input { touch-action:manipulation; }
@media (max-height:700px) {
 .topbar { padding-top:calc(3px + env(safe-area-inset-top)); padding-bottom:3px; }
 .logo { width:33px; height:33px; }
 .subtitle { font-size:12px; }
 .top-actions { margin-top:1px; }
 .count-input { height:clamp(26px,4.6dvh,34px); }
 .summary { padding-top:3px; padding-bottom:calc(3px + env(safe-area-inset-bottom)); }
 .action { min-height:31px; font-size:13px; }
 .actions .action:last-child { min-height:29px; }
}
@media (min-width:600px) {
 .topbar { padding:8px 14px 7px; }
 .logo { width:42px; height:42px; }
 .brand-name { font-size:18px; }
 .subtitle { font-size:14px; }
 .top-actions { font-size:13px; margin-top:4px; }
 #rows.rows { padding:3px 18px; }
 .denom-row { grid-template-columns:90px minmax(0,1fr) 105px; }
 .denom-label { font-size:17px; }
 .line-total { font-size:16px; }
 .count-input { height:clamp(30px,5dvh,42px); }
 .summary { padding:5px 18px; }
 .action { min-height:36px; }
 .actions .action:last-child { min-height:34px; }
}
/* Hide the add-row container in normal use so it does not waste screen height. */
.app:not(.edit-mode) > .rows[style] { display:none; }
.app.edit-mode > .rows[style] { display:block; flex:0 0 auto; padding:0 10px; }
/* Extra rows are only needed while editing; allow that mode to scroll. */
.app.edit-mode #rows.rows { overflow-y:auto; }


/* Requested final mobile UI refinements */
* { -webkit-tap-highlight-color: transparent; }
body, .app, .topbar, .brand, .brand-name, .subtitle, .denom-label, .line-total, .summary, .total-label, .total-amount, .words, .date-line, button {
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
input, textarea { -webkit-user-select: text; user-select: text; }
.topbar { position: relative; padding-top: calc(9px + env(safe-area-inset-top)); padding-bottom: 6px; }
.settings-btn { position:absolute; left:8px; top:calc(8px + env(safe-area-inset-top)); width:34px; height:34px; padding:0; border:0; border-radius:9px; color:#fff; background:#ffffff20; font-size:23px; line-height:1; z-index:2; }
.brand { gap:9px; }
.logo { border-radius:0 !important; background:transparent !important; padding:0 !important; width:46px; height:46px; }
.brand-name { font-size:clamp(15px,4vw,20px); line-height:1.12; }
.subtitle { margin-top:5px; font-size:17px; font-weight:700; letter-spacing:0; }
.top-actions { margin-top:3px; font-size:13px; }
#rows.rows { padding:2px 10px; }
.denom-row { grid-template-columns: minmax(48px,60px) minmax(0,1fr) minmax(68px,86px); gap:5px; padding:4px 0; min-height:49px; }
.count-input { width:100%; max-width:138px; justify-self:center; height:37px; padding:2px 5px; font-size:17px; }
.denom-label { font-size:15px; }
.line-total { font-size:13px; }
.row-controls { padding:2px 0 4px; }
.small-btn { padding:5px 9px; }
.actions .action:last-child { display:block !important; grid-column:auto !important; min-height:36px; }
@media (min-width:600px) {
  .logo { width:50px; height:50px; }
  .denom-row { grid-template-columns:70px minmax(0,1fr) 100px; }
  .count-input { max-width:150px; }
}
@media (max-height:700px) {
  .topbar { padding-top:calc(5px + env(safe-area-inset-top)); padding-bottom:3px; }
  .logo { width:38px; height:38px; }
  .subtitle { font-size:15px; }
  .denom-row { min-height:42px; }
  .count-input { height:32px; }
}

<script>
// Prevent accidental pinch and double-tap zoom while preserving ordinary taps and typing.
(function lockAccidentalZoom() {
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('contextmenu', function (e) { if (!e.target.matches('input')) e.preventDefault(); });
  document.addEventListener('gesturechange', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('gestureend', function (e) { e.preventDefault(); }, { passive: false });
  document.addEventListener('touchmove', function (e) {
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', function (e) {
    const now = Date.now();
    if (now - lastTouchEnd <= 280) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });
})();

const DEFAULTS=[500,200,100,50,20,10,5,2,1];
let denominations=DEFAULTS.map((value,i)=>({id:'d'+i,value,count:0}));
let editMode=false;
const $=id=>document.getElementById(id);
const fmt=n=>new Intl.NumberFormat('en-IN',{maximumFractionDigits:0}).format(n);
function wordsUnder1000(n){const ones=['Zero','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];let s='';if(n>=100){s+=ones[Math.floor(n/100)]+' Hundred';n%=100;if(n)s+=' ';}if(n>=20){s+=tens[Math.floor(n/10)];if(n%10)s+=' '+ones[n%10];}else if(n>0||!s)s+=ones[n];return s;}
function numberWords(n){n=Math.floor(Math.max(0,n));if(n===0)return 'Zero Rupees Only';const parts=[];const groups=[[10000000,'Crore'],[100000,'Lakh'],[1000,'Thousand'],[100,'Hundred']];for(const [v,label] of groups){if(n>=v){const q=Math.floor(n/v);if(v===100){parts.push(wordsUnder1000(q)+' '+label);n%=v;}else{parts.push(wordsUnder1000(q)+' '+label);n%=v;}}}if(n)parts.push(wordsUnder1000(n));return parts.join(' ')+' Rupees Only';}
function total(){return denominations.reduce((s,d)=>s+d.value*(Number(d.count)||0),0)}
function countNotes(){return denominations.reduce((s,d)=>s+(Number(d.count)||0),0)}
function render(){const rows=$('rows');rows.innerHTML='';denominations.forEach(d=>{const row=document.createElement('div');row.className='denom-row';row.innerHTML=`<div class="denom-label">₹${fmt(d.value)}</div><input class="count-input" type="number" min="0" step="1" inputmode="numeric" pattern="[0-9]*" aria-label="Quantity of ₹${d.value} notes or coins" placeholder="0" value="${d.count||''}" data-id="${d.id}"><div class="line-total" id="line-${d.id}">= ₹${fmt(d.value*(Number(d.count)||0))}</div><div class="row-controls"><button class="small-btn" data-action="remove" data-id="${d.id}">Remove</button></div>`;rows.appendChild(row);});$('app').classList.toggle('edit-mode',editMode);$('editBtn').setAttribute('aria-label',editMode?'Close settings':'Calculator settings');$('editBtn').title=editMode?'Done':'Settings';$('editBtn').textContent=editMode?'✓':'⚙';updateTotals();}
function updateTotals(){const t=total();$('totalAmount').textContent='₹'+fmt(t);$('totalWords').textContent=numberWords(t);denominations.forEach(d=>{const el=$('line-'+d.id);if(el)el.textContent='= ₹'+fmt(d.value*(Number(d.count)||0));});}
function setDate(){const d=new Date();$('dateLine').textContent=d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})+' · '+d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
let toastTimer;function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display='none',2400)}
$('rows').addEventListener('input',e=>{if(!e.target.matches('.count-input'))return;const d=denominations.find(x=>x.id===e.target.dataset.id);if(!d)return;let v=e.target.value===''?'':Math.max(0,Math.floor(Number(e.target.value)||0));d.count=v;updateTotals();try{localStorage.setItem('kkc-current-counts',JSON.stringify(denominations));}catch(_){}});
$('rows').addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;const i=denominations.findIndex(x=>x.id===b.dataset.id);if(i<0)return;const a=b.dataset.action;if(a==='remove'){if(denominations.length===1){toast('Keep at least one denomination.');return;}denominations.splice(i,1);}else if(a==='up'&&i>0){[denominations[i-1],denominations[i]]=[denominations[i],denominations[i-1]];}else if(a==='down'&&i<denominations.length-1){[denominations[i+1],denominations[i]]=[denominations[i],denominations[i+1]];}render();});
$('editBtn').addEventListener('click',()=>{editMode=!editMode;render();});
$('addBtn').addEventListener('click',()=>{const raw=prompt('Enter denomination value in rupees (numbers only):');if(raw===null)return;const v=Math.floor(Number(raw));if(!Number.isFinite(v)||v<=0){toast('Enter a denomination greater than zero.');return;}if(denominations.some(d=>d.value===v)){toast('That denomination already exists.');return;}denominations.push({id:'d'+Date.now(),value:v,count:0});denominations.sort((a,b)=>b.value-a.value);render();toast('Denomination added.');});
function snapshot(){return {company:'KARDE KRISHNA CHITS PRIVATE LIMITED',date:new Date().toISOString(),denominations:denominations.map(d=>({value:d.value,count:Number(d.count)||0,amount:d.value*(Number(d.count)||0)})),total:total(),words:numberWords(total()),notes:countNotes()};}
function getSaved(){try{return JSON.parse(localStorage.getItem('kkc-saved-counts')||'[]')}catch(_){return []}}
function saveRecord(){const rec=snapshot();if(rec.total===0&&!confirm('The total is ₹0. Save this count anyway?'))return;const saved=getSaved();saved.unshift(rec);try{localStorage.setItem('kkc-saved-counts',JSON.stringify(saved.slice(0,100)));localStorage.setItem('kkc-current-counts',JSON.stringify(denominations));}catch(_){toast('Device storage is full or unavailable.');return;}showSaved();}
function showModal(title,content){$('modalTitle').textContent=title;$('modalContent').innerHTML=content;$('modalBackdrop').style.display='flex';}
function showSaved(){const saved=getSaved();let content=saved.length?saved.map((r,i)=>`<div class="saved-item"><div><strong>₹${fmt(r.total)}</strong><small>${new Date(r.date).toLocaleString('en-IN')}<br>${esc(r.words)}</small></div><div style="display:flex;flex-direction:column;gap:6px"><button style="background:#e6f3fb;color:#176b9e" data-load="${i}">Load</button><button style="background:#fce9e7;color:#b52e24" data-delete="${i}">Delete</button></div></div>`).join(''):'<div class="empty">No saved counts yet.</div>';showModal('Saved cash counts',content);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('modalContent').addEventListener('click',e=>{const l=e.target.closest('[data-load]'),del=e.target.closest('[data-delete]');if(l){const r=getSaved()[Number(l.dataset.load)];if(!r)return;denominations=r.denominations.map((d,i)=>({id:'d'+Date.now()+i,value:d.value,count:d.count}));render();$('modalBackdrop').style.display='none';toast('Saved count loaded.');}if(del){const a=getSaved();a.splice(Number(del.dataset.delete),1);localStorage.setItem('kkc-saved-counts',JSON.stringify(a));showSaved();}});
$('saveBtn').addEventListener('click',saveRecord);$('closeModal').addEventListener('click',()=>$('modalBackdrop').style.display='none');$('modalBackdrop').addEventListener('click',e=>{if(e.target===$('modalBackdrop'))$('modalBackdrop').style.display='none';});
$('clearBtn').addEventListener('click',()=>{if(!confirm('Clear all denomination quantities?'))return;denominations.forEach(d=>d.count=0);render();try{localStorage.setItem('kkc-current-counts',JSON.stringify(denominations));}catch(_){}toast('All quantities cleared.');});
function makeImage(){return new Promise((resolve,reject)=>{const s=snapshot(),canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),w=650,pad=30,rowH=43,headerH=130,footerH=210,h=headerH+56+s.denominations.length*rowH+footerH;canvas.width=w;canvas.height=h;ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.fillStyle='#3699d5';ctx.fillRect(0,0,w,headerH);const img=new Image();img.onload=()=>{ctx.drawImage(img,30,25,66,66);ctx.fillStyle='#fff';ctx.textAlign='left';ctx.font='bold 23px Arial';ctx.fillText('KARDE KRISHNA CHITS',108,53);ctx.font='600 19px Arial';ctx.fillText('CASH COUNT SUMMARY',108,87);ctx.font='16px Arial';ctx.fillText(new Date(s.date).toLocaleString('en-IN'),pad,115);let y=headerH;ctx.fillStyle='#edf4f8';ctx.fillRect(0,y,w,45);ctx.fillStyle='#33495c';ctx.font='bold 16px Arial';ctx.textAlign='left';ctx.fillText('DENOMINATION',pad,y+29);ctx.textAlign='center';ctx.fillText('QUANTITY',325,y+29);ctx.textAlign='right';ctx.fillText('AMOUNT',w-pad,y+29);y+=45;s.denominations.forEach((d,i)=>{ctx.fillStyle=i%2?'#fff':'#f8fafb';ctx.fillRect(0,y,w,rowH);ctx.fillStyle='#405466';ctx.font='19px Arial';ctx.textAlign='left';ctx.fillText('₹'+fmt(d.value),pad,y+28);ctx.textAlign='center';ctx.fillText(fmt(d.count),325,y+28);ctx.textAlign='right';ctx.fillText('₹'+fmt(d.amount),w-pad,y+28);y+=rowH;});y+=10;ctx.strokeStyle='#d5e0e7';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(w-pad,y);ctx.stroke();y+=47;ctx.fillStyle='#237cb5';ctx.font='bold 20px Arial';ctx.textAlign='left';ctx.fillText('TOTAL CASH AMOUNT',pad,y);ctx.textAlign='right';ctx.font='bold 28px Arial';ctx.fillText('₹'+fmt(s.total),w-pad,y);y+=37;ctx.fillStyle='#34495a';ctx.textAlign='left';ctx.font='bold 16px Arial';ctx.fillText('Amount in words:',pad,y);y+=26;ctx.font='17px Arial';wrapText(ctx,s.words,pad,y,w-2*pad,23);ctx.fillStyle='#8695a2';ctx.font='17px Arial';ctx.textAlign='center';ctx.fillText('Generated by Cash Denomination Calculator',w/2,h-30);canvas.toBlob(blob=>blob?resolve({blob,canvas}):reject(new Error('Could not create image')),'image/png');};img.onerror=()=>reject(new Error('Logo could not be loaded'));img.src=$('brandLogo').src;});}
function wrapText(ctx,text,x,y,maxWidth,lineHeight){const words=text.split(' ');let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){ctx.fillText(line,x,y);line=word;y+=lineHeight;}else line=test;}if(line)ctx.fillText(line,x,y);}
async function imageBlob(){try{return await makeImage()}catch(e){throw e}}
$('shareBtn').addEventListener('click',async()=>{try{const {blob}=await imageBlob();const file=new File([blob],'KKC-Cash-Count.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'KKC Cash Count',text:numberWords(total())+' — ₹'+fmt(total())});}else{downloadBlob(blob,'KKC-Cash-Count.png');toast('Image downloaded. Open Photos/Files to share it.');}}catch(e){if(e.name!=='AbortError')toast('Sharing is not available here. Use Save Image instead.');}});
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}
// Save opens a menu so the user can save both the current count and its image.
$('saveBtn').addEventListener('contextmenu',e=>e.preventDefault());
const originalSave=saveRecord;
$('saveBtn').addEventListener('dblclick',async()=>{try{const {blob}=await imageBlob();downloadBlob(blob,'KKC-Cash-Count.png');toast('Cash count image downloaded.');}catch(_){toast('Could not create image.');}});
// Restore the latest unsaved quantities on this device.
try{const cur=JSON.parse(localStorage.getItem('kkc-current-counts')||'null');if(Array.isArray(cur)&&cur.length){denominations=cur.map((d,i)=>({id:'d'+i,value:Number(d.value)||1,count:Number(d.count)||0}));}}catch(_){}
render();setDate();setInterval(setDate,1000);
</script></body></html>
